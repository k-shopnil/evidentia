{% extends "base.html" %}

{% block title %}Reset Password - {{ settings.APP_NAME }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
        <div class="card auth-card">
            <div class="card-header text-center">
                <img src="/static/img/logo-color.svg" alt="{{ settings.APP_NAME }}" class="auth-logo">
                <div class="auth-sub">choose a new password</div>
            </div>
            <div class="card-body">
                {% if error %}
                <div class="alert alert-danger">{{ error }}</div>
                {% endif %}

                <form method="post" action="/reset-password">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                    <input type="hidden" name="token" value="{{ token }}">

                    <div class="mb-3">
                        <label for="password" class="form-label">New password (min 12 characters)</label>
                        <input type="password" class="form-control" id="password" name="password" required autocomplete="new-password" minlength="12" autofocus>
                    </div>

                    <div class="mb-3">
                        <label for="confirm_password" class="form-label">Confirm password</label>
                        <input type="password" class="form-control" id="confirm_password" name="confirm_password" required autocomplete="new-password" minlength="12">
                    </div>

                    <button type="submit" class="btn btn-primary w-100">Update Password</button>
                </form>

                <div class="text-center mt-3">
                    <a href="/login">Back to login</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
